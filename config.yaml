# ===========================================
# Telegram Shop 配置文件
# ===========================================

server:
  # HTTP 服务监听地址（用于支付回调 webhook + 健康检查）
  addr: ":8080"
  # 对外可访问的基础 URL（用于拼接支付回调地址）。
  # 子路径反代：nginx location /tgshop/ → proxy_pass http://127.0.0.1:8080/（剥前缀）
  base_url: "https://shop.example.com/tgshop"

telegram:
  # 从 @BotFather 获取的 Bot Token
  bot_token: "YOUR_BOT_TOKEN_HERE"
  # 是否使用 webhook 模式（false = long polling，开发推荐 polling）
  use_webhook: false
  # webhook 模式下 Telegram 回调的路径
  webhook_path: "/telegram/webhook"
  # 管理员的 Telegram User ID（可多个），用于 /admin 命令
  admin_ids:
    - 123456789

# 可购买的充值额度（单位：元）。菜单按此顺序生成按钮。
amounts:
  - 5
  - 10
  - 20
  - 50
  - 100
  - 200
  - 500

# 自定义金额范围（单位：元）。用户可在额度菜单点「自定义金额」手动输入此区间内的任意金额。
min_amount: 1
max_amount: 1000

database:
  # PostgreSQL DSN（Docker 内连服务名 postgres；密码与 docker-compose.yml 一致）
  dsn: "host=postgres port=5432 user=postgres password=CHANGE_ME dbname=telegram_shop sslmode=disable TimeZone=Asia/Shanghai"

payment:
  # 订单有效期（分钟）
  order_timeout_minutes: 30

  easypay:
    enabled: true
    # Dulupay V2 易支付网关地址（默认 https://api.dulupay.com，调用 api/pay/submit）
    gateway_url: "https://api.dulupay.com"
    # 商户 ID（Dulupay 后台「个人资料 -> API 信息」中的 PID）
    merchant_id: "YOUR_MERCHANT_ID"
    # 平台公钥（Dulupay 后台「个人资料 -> API 信息」的平台公钥，裸 base64，用于回调验签）
    platform_public_key: "your_dulupay_platform_public_key_base64"
    # 商户私钥（Dulupay 后台「生成商户RSA密钥对」得到的商户私钥，裸 base64，用于请求签名）
    merchant_private_key: "your_dulupay_merchant_private_key_base64"
    # 默认支付通道：alipay / wxpay / qqpay / bank
    default_channel: "alipay"

  usdt:
    # 通过 BEpusdt 网关收款（多链 USDT：TRC20 / BEP20 等）。
    # 链上确认、收款地址生成、汇率均由 BEpusdt 负责，本服务仅作为其商户。
    enabled: true
    # BEpusdt 部署地址（Docker 内走服务名；后台配置在 http://<服务器IP>:8090）
    base_url: "http://bepusdt:8080"
    # BEpusdt 后台「系统管理 → 基础设置 → API 设置」的 Integration Token
    api_token: "YOUR_BEPUSDT_API_TOKEN"
    # 计价法币（CNY / USD / EUR / GBP / JPY），默认 CNY
    fiat: "CNY"
    # 调用 BEpusdt 的 HTTP 超时（秒），默认 15
    timeout_seconds: 15
    # 菜单展示哪些链（至少启用一个）。需在 BEpusdt 侧配置好对应链的收款地址与 RPC。
    trc20_enabled: false
    bep20_enabled: true

sub2api:
  # sub2api 的 webhook 回调地址
  webhook_url: "https://sub2api.example.com/api/v1/payment/webhook/tgshop"
  # 只读余额查询端点（留空则默认派生为 webhook_url + "/balance"）
  # balance_url: "https://sub2api.example.com/api/v1/payment/webhook/tgshop/balance"
  # 与 sub2api 约定的 HMAC 共享密钥（sub2api 侧 tgshop.webhook_secret 必须一致）
  webhook_secret: "your_shared_secret_change_me"
  # 回调超时（秒）
  timeout_seconds: 15
  # 回调失败最大重试次数
  max_retries: 5

# 节日活动：修改本地配置后重启加载，运行中按时间自动启停。
# 示例默认关闭，启用前设置自己需要的模式、比例和时间。
promotion:
  enabled: false
  mode: discount  # discount: 少付款；gift: 多到账；旧配置未填时为 gift
  # percent 是减免/赠送百分比，10 表示九折或赠送 10%，不是一折。
  percent: 10
  # 无时区日期按 Asia/Shanghai；亦支持 RFC3339。起止边界均包含。
  # 留空表示该侧不限制；无效格式或倒置时间会阻止启动。
  start_at: "2026-10-01 00:00:00"
  end_at: "2026-10-07 23:59:59"
